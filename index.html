<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyaz Tavşan'ın Çay Saati Sayacı</title>
    <!-- Tasarım için Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Quicksand:wght@500;700&display=swap');
        .wonderland-font { font-family: 'Cinzel', serif; }
        .body-font { font-family: 'Quicksand', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 body-font">

    <!-- Sihirli Çerçeve Kutusu -->
    <div class="max-w-md w-full bg-slate-900/80 border-2 border-amber-500/50 rounded-3xl p-6 shadow-2xl backdrop-blur-md text-center relative overflow-hidden">
        
        <!-- Tavşan Kulakları / Dekoratif Üst İkon -->
        <div class="absolute -top-10 left-1/2 transform -translate-x-1/2 text-4xl">
            🐇⏳
        </div>

        <!-- Başlık -->
        <h2 class="wonderland-font text-xl sm:text-2xl text-amber-400 mt-2 mb-1">
            Beyaz Tavşan'ın Saat Kulesi
        </h2>
        <p class="text-xs text-slate-400 mb-6 italic">
            "Geç kaldım, geç kaldım! Çay saatine ne kadar kaldı?"
        </p>

        <!-- Sayaç Kutuları -->
        <div class="grid grid-cols-4 gap-2 mb-6">
            <div class="bg-slate-950/60 border border-amber-500/30 rounded-xl p-3">
                <span id="days" class="wonderland-font text-2xl sm:text-3xl text-amber-300 font-bold">00</span>
                <span class="block text-[10px] text-slate-400 uppercase tracking-widest mt-1">Gün</span>
            </div>
            <div class="bg-slate-950/60 border border-amber-500/30 rounded-xl p-3">
                <span id="hours" class="wonderland-font text-2xl sm:text-3xl text-amber-300 font-bold">00</span>
                <span class="block text-[10px] text-slate-400 uppercase tracking-widest mt-1">Saat</span>
            </div>
            <div class="bg-slate-950/60 border border-amber-500/30 rounded-xl p-3">
                <span id="minutes" class="wonderland-font text-2xl sm:text-3xl text-amber-300 font-bold">00</span>
                <span class="block text-[10px] text-slate-400 uppercase tracking-widest mt-1">Dakika</span>
            </div>
            <div class="bg-slate-950/60 border border-amber-500/30 rounded-xl p-3">
                <span id="seconds" class="wonderland-font text-2xl sm:text-3xl text-red-400 font-bold">00</span>
                <span class="block text-[10px] text-slate-400 uppercase tracking-widest mt-1">Saniye</span>
            </div>
        </div>

        <!-- "Zaman Durdu!" Butonu (Interaktif Eğlence) -->
        <button onclick="zamanDurdu()" class="w-full py-3 px-4 bg-gradient-to-r from-amber-600 to-red-600 hover:from-amber-500 hover:to-red-500 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 text-sm sm:text-base wonderland-font tracking-wide">
            🎩 Zamanı Durdur (Çay Saati!)
        </button>

        <!-- Tavşan'ın Mesaj Alanı -->
        <p id="tavsanMesaji" class="text-xs text-amber-200/80 mt-4 min-h-[20px] transition-all">
            "Acele et Menesse, çaylar soğuyor!"
        </p>
    </div>

    <!-- JavaScript ile Zamanı Yönetme -->
    <script>
        // Çay saati hedef tarihini belirle (Örn: Gelecek Pazar veya belirleyeceğin bir saat)
        // Burada örnek olması için bugünden 3 gün sonrasını seçiyoruz:
        const hedefZaman = new Date().getTime() + (3 * 24 * 60 * 60 * 1000);
        let sayacAktif = true;

        function sayaciGuncelle() {
            if (!sayacAktif) return;

            const simdi = new Date().getTime();
            const kalan = hedefZaman - simdi;

            if (kalan < 0) {
                document.getElementById("tavsanMesaji").innerText = "🎉 Çay saati başladı! Şapkacı seni bekliyor!";
                return;
            }

            const gun = Math.floor(kalan / (1000 * 60 * 60 * 24));
            const saat = Math.floor((kalan % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const dakika = Math.floor((kalan % (1000 * 60 * 60)) / (1000 * 60));
            const saniye = Math.floor((kalan % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(gun).padStart(2, '0');
            document.getElementById("hours").innerText = String(saat).padStart(2, '0');
            document.getElementById("minutes").innerText = String(dakika).padStart(2, '0');
            document.getElementById("seconds").innerText = String(saniye).padStart(2, '0');
        }

        // Butona tıklandığında "Zaman Durdu!" konsepti
        function zamanDurdu() {
            sayacAktif = !sayacAktif;
            const mesaj = document.getElementById("tavsanMesaji");
            if (!sayacAktif) {
                mesaj.innerText = "⏳ Harikalar Diyarı'nda zaman durdu! Şapkacı çay dolduruyor...";
                mesaj.style.color = "#38bdf8"; // Mavi renk vurgusu
            } else {
                mesaj.innerText = "🏃‍♂️ Saatler tekrar çalışmaya başladı! Kaçıyoruz!";
                mesaj.style.color = "#fde047";
            }
        }

        setInterval(sayaciGuncelle, 1000);
    </script>
</body>
</html>
